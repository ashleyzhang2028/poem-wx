$:
  # 任意分支：只跑自检，不出镜像（出了也没人用，只往制品库堆垃圾）。
  "**":
    - name: 自检
      image: node:20
      script:
        - bash scripts/clone-poem.sh /tmp/poem
        - POEM_WEB_DIR=/tmp/poem node scripts/build-data.js
        - node scripts/check.js
        - node scripts/parity.js
        # 端到端：小程序端 utils ↔ poem 服务端真跑一遍（登录 → 同步 → 换机）。
        - POEM_DIR=/tmp/poem node scripts/e2e-wx-sync.js
        # 端到端（换库那条）：摊一个构建上下文出来，按线上那份容器的启动路径
        # （serve-api.js 接线 → require handler）接上 MySQL，跑登录 → 同步，
        # 并验「新的赢」这条不变式换库之后还在（Issue #111）。
        - POEM_DIR=/tmp/poem node scripts/e2e-mysql.js

# main —— 唯一的分支。推这里就是发一次版：自检 → 镜像 → GHCR → 体验版 → 同步 GitHub。
main:
  push:
    - name: 发布（自检 → 镜像 → GHCR → 体验版）
      # 必须是 `docker.image`，不是 `image`（流水线级没有 `image` 这个字段，写错会被静默忽略，
      # 退回的缺省镜像里没有 node）。任务级写 `image` 是合法的，别一起改。
      docker:
        image: node:20
      services:
        - docker
      imports:
        # 密钥只从密钥仓库读（那个仓库禁止 clone，git clone 一律回 Repository Not Found）。
        - https://cnb.cool/npu-gpu-cpu/poem-wechat-mini-program-secrets/-/blob/main/wechat-ci.yml
      env:
        # ⚠️ IMAGE 必须在这儿定义：build & push 那步是 `set -eu`，撞上未定义变量当场退出。
        # ⚠️ 值只写**字面量** —— CNB 的变量替换只认 `$VAR`，`${VAR}` / `${VAR:-default}`
        #    既不报错也不清空，原样拼进镜像 tag，直到 docker 才炸。
        # 回滚：把 IMAGE 换成下面 CNB_IMAGE 的值（代价是云托管要重配拉取凭据）。
        IMAGE: ghcr.io/ashleyzhang2028/poem-wx/wx-api
        CNB_IMAGE: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/wx-api
        TAG: ${CNB_COMMIT_SHORT}
      stages:
        - name: clone poem
          script: bash scripts/clone-poem.sh /tmp/poem
        # 自检不在这儿重复：同一次 push 里 $."**" 那条已经跑过完全一样的三条。
        # 摊构建上下文：poem 的 api/ + 本仓库的 Dockerfile 与服务壳，平铺在同一层，
        # 因为 Dockerfile 按 ./api 与 ./serve-api.js 拷，.dockerignore 也只认上下文根。
        - name: stage context
          script: |
            # 别写 `set -euo pipefail`：Alpine 的 busybox sh 不认 `-o pipefail`。
            set -eu
            mkdir -p /tmp/ctx
            cp -R /tmp/poem/api /tmp/ctx/api
            cp deploy/Dockerfile /tmp/ctx/Dockerfile
            cp deploy-api-serve/serve-api.js /tmp/ctx/serve-api.js
            # 存储层那份 MySQL 实现（Issue #111）：它跟着服务壳走，同一层、同一个名字。
            # 漏了这一行 → Dockerfile 那句 COPY 找不到源，构建回
            #   failed to calculate checksum ... "/store-mysql.js": not found
            # 而那看着像「文件没提交」，其实是上下文少摊了一样东西。
            cp deploy/store-mysql.js /tmp/ctx/store-mysql.js
            # 分片路由那份（Issue #121 方案 A）：与 serve-api.js 同层同名。
            cp deploy-api-serve/shard-api.js /tmp/ctx/shard-api.js
            # 正文分片：**只在 COPY_SHREDS=1 时摊进上下文**，且摊的是压缩后那份。
            # 为什么在这儿摊而不是在 Dockerfile 里现取：Dockerfile 的 COPY 源只能来自
            # 构建上下文，而分片是**构建产物**（.gitignore 里 miniprogram/data/），
            # checkout 里本来就没有 —— 得先在这里生成。
            #
            # 为什么默认**不摊**：25MB 分片压缩后 5.6MB，是刻意不摊进每次构建的
            # —— 绝大多数调试构建用不到它。要分片时在流水线的 env 里加
            # `COPY_SHREDS: "1"`（见 wx-cloud-setup.md § 二点五）。
            if [ "${COPY_SHREDS:-}" = "1" ]; then
              echo "摊分片进上下文（COPY_SHREDS=1）"
              bash scripts/clone-poem.sh /tmp/poem >/dev/null 2>&1 || true
              POEM_WEB_DIR=/tmp/poem node scripts/build-data.js >/dev/null
              mkdir -p /tmp/ctx/shard-src
              for f in miniprogram/data/texts/*.json; do
                gzip -9 -c "$f" > "/tmp/ctx/shard-src/$(basename "$f").gz"
              done
              du -sh /tmp/ctx/shard-src
            fi
            # ⚠️ 忽略文件跟**构建上下文**走：摆错位置不报错，只让上下文从 0.3MB 变成 38MB。
            cp deploy-api-serve/.dockerignore /tmp/ctx/.dockerignore
            echo "上下文体积（白名单生效约 0.3MB，没生效约 38MB）："
            du -sh /tmp/ctx
        - name: build & push
          script: |
            set -eu
            # 忽略文件没摆到上下文根，构建照样成功，只是每次白传 37MB —— 绿着出错，当场断掉。
            if [ ! -f /tmp/ctx/.dockerignore ]; then
              echo "✗ 上下文根上没有 .dockerignore —— 白名单没摆到生效的位置。" >&2
              exit 1
            fi
            REV="$(git -C /tmp/poem rev-parse --short HEAD)"
            # 要登的就是 IMAGE 那个 registry（GHCR），不是 CNB —— 推哪儿就得先登哪儿，
            # 否则回 `error from registry: denied`，看着像 PAT 没权限。
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            # CNB 那行 login 不能删：基础镜像与构建缓存仍从 CNB 拉。
            docker login -u "${CNB_TOKEN_USER_NAME}" -p "${CNB_TOKEN}" "${CNB_DOCKER_REGISTRY}"
            docker build \
              --build-arg "COPY_SHREDS=${COPY_SHREDS:-}" \
              --build-arg "API_REV=${REV}" \
              --build-arg "BASE_IMAGE=${BASE_IMAGE:-node:20-alpine}" \
              --build-arg "API_SYNCED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --build-arg "API_SOURCE=https://cnb.cool/${CNB_ROOT_SLUG}/poem.git" \
              -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" /tmp/ctx
            docker push "${IMAGE}:${TAG}"
            docker push "${IMAGE}:latest"
            echo "✓ ${IMAGE}:${TAG}（后端 poem ${REV}）"
        # 再推一份到 GHCR：CNB 制品库可见性跟着代码仓库走（仓库私有 → 制品私有 →
        # 云托管要拉就得配凭据），GHCR 那份是公开包，不用配。tag 用上游 poem 的短 sha
        # ——「线上跑的是哪一版 poem」只有它答得了。第一次推完要去 GitHub 把包设成 Public。
        # ⚠️ GHCR_TOKEN 必须是 classic PAT（fine-grained 的 Permissions 里没有 Packages 那一栏）。
        - name: 推 GHCR（云托管那份镜像地址）
          script: |
            set -eu
            for v in GHCR_USER GHCR_TOKEN; do
              # 这里的 `:-` 是 shell 的（`env:` 里没有这回事）：`set -u` 之下撞上未定义
              # 变量直接退出，那句给人看的横幅根本打不出来。
              eval "val=\${$v:-}"
              if [ -z "$val" ]; then
                echo "✗ 密钥仓库 wechat-ci.yml 里读不到 $v" >&2
                echo "  GHCR_USER=GitHub 账号名；GHCR_TOKEN 是带 write:packages 的 classic PAT。" >&2
                exit 1
              fi
            done
            REV="$(git -C /tmp/poem rev-parse --short HEAD)"
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker tag "${IMAGE}:${TAG}" "${IMAGE}:${REV}"
            docker push "${IMAGE}:${REV}"
            echo "✓ ${IMAGE}:${REV}（公开包 —— 云托管从地址拉镜像不用配凭据）"
        # 上传体验版：只上传，不提审 ——「要不要上线」不该由流水线决定。
        # 整步用一个 script 块：list 混多行块会被 CNB 串成 &&，busybox sh 报语法错，
        # 而这步 allow_failure，红了流水线也是绿的 —— 得自己翻日志才看得见。
        - name: 上传体验版
          script: |
            for v in WX_APPID WX_PRIVATE_KEY_B64; do
              eval "val=\$$v"
              if [ -z "$val" ]; then
                echo "✗ 密钥仓库 wechat-ci.yml 里读不到 $v" >&2
                echo "  已注入的变量名（只列名字）：" >&2
                env | grep -oE '^(WX|WECHAT)[A-Z0-9_]*' | sort -u >&2
                exit 1
              fi
            done
            # 语料是构建产物（.gitignore 里有 miniprogram/data/），checkout 里本来就没有；
            # 上传的是整个 miniprogram，缺了它 upload.js 只会回一句「语料还没生成」。
            # 自检那三条跑在同一次 push 的另一个任务里，工作区不共享，得在这儿重跑一遍。
            POEM_WEB_DIR=/tmp/poem node scripts/build-data.js
            # --loglevel=error：默认那档会吐 40 行 npm warn，真错被埋在中间。
            npm i -D miniprogram-ci --no-audit --no-fund --loglevel=error
            node scripts/upload.js "${TAG}" "main ${TAG}" || {
              code=$?
              echo "" >&2
              echo "✗✗✗ 上传体验版没成功（退出码 ${code}） ✗✗✗" >&2
              echo "  这步是 allow_failure：流水线不会红，别以为绿了就传上去了。" >&2
              exit "${code}"
            }
            echo "✓✓✓ 体验版已上传 ${TAG} ✓✓✓"
          allow_failure: true
        # 同步到 GitHub：只同步 main（仓库有 80 多个分支，大半是合完就没用的 auto/*）。
        # 推的是 HEAD:refs/heads/main 且带 --force —— GitHub 那份是只读镜像，别在它上面提交。
        # 这条不 allow_failure：同步是这一版交付的一部分，断了就该红。
        - name: 同步到 GitHub
          imports:
            - https://cnb.cool/npu-gpu-cpu/poem-wechat-mini-program-secrets/-/blob/main/wechat-ci.yml
          script:
            - node scripts/sync-github.js

# 跟上游：**不做发布链的一步**，是定时的、独立的、红了也不拦谁的那一步。
#
# 为什么单开一条：发布链里 clone 的是 poem.lock.json 钉住的那一版，
# 上游动与不动都影响不到「我们推 main」。上游真动了，由这条流水线自己冒出来
# —— 自检绿就开 PR 把锁前进一位，自检红就在 Issue 上留一条。
# 口径与四种出口见 docs/data-backend.md § 四。
#
# ⚠️ 语法是 `main: { "crontab: <POSIX cron>": [...] }`，与 `push:` **并列**
#    在同一个 `main:` 之下 —— **不是**顶格另起一个 `crontab:` 键，
#    也不是第二个 `main:`。两种情况都解析得出 YAML，但流水线会不见：
#      顶格 `crontab:`   → 平台报 `CONFIG_EVENT_EMPTY / $ 下无 api_trigger 事件配置`
#                          （看着像 `$` 段写坏了，与真正的原因差着十万八千里）
#      第二个 `main:`    → YAML 的键重复，**后面那个把前面那个整个盖掉**，
#                          发布链就此消失，而文件本身看着完全正常
#    两种都实测踩过。见 https://docs.cnb.cool/zh/build/crontab.md
#
#    表达式是五段 POSIX cron，时区 Asia/Shanghai，最小间隔 5 分钟。
#    `0 */6 * * *` = 每 6 小时一次：语料是「几天改一次」的量级，够用；
#    又不至于让一次红了的跟随拖到第二天才被人看见。
#
# ⚠️ 这条**不 import 密钥仓库**：它只读上游那个公开仓库。
#    要开 PR / 留评论才需要 CNB 令牌，那由平台注入的 CNB_TOKEN 顶着。
  "crontab: 0 */6 * * *":
    - name: 跟上游语料（poem-watch）
      image: node:20
      script:
        - bash scripts/poem-watch.sh
